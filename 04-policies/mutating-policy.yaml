apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-safe-observability-labels
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              labels: Object.metadata.labels{
                demo: "true",
                observability: "enabled",
                environment: "demo",
                team: "observability"
              }
            }
          }
